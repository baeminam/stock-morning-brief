name: Morning Stock Brief

on:
  schedule:
    # 목표 수신 08:00 KST. GitHub cron은 수 분~1시간 지연될 수 있어
    # 06:37 KST(= 21:37 UTC, 전날)에 예약해 지연 여유를 둠. 정각(:00) 회피.
    - cron: '37 21 * * *'
  workflow_dispatch:

jobs:
  build-and-send:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Korean/Japanese fonts (for PDF rendering)
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk

      - name: Run morning brief pipeline
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          REPORT_EMAIL: ${{ secrets.REPORT_EMAIL }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python src/main.py --send-email

      - name: Upload generated data
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: report-data
          path: data/
